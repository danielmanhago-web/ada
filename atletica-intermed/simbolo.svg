<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Símbolo: cocar estilizado (leque de penas) sobre faixa de grafismo -->
    <g id="pena">
      <path fill-rule="evenodd" d="M-2.5,-2 L-7,-14 L-8.5,-25 L-3.5,-28 L-8.5,-31 L-8,-42 L-4,-52 L0,-58 L4,-52 L8,-42 L8.5,-31 L3.5,-28 L8.5,-25 L7,-14 L2.5,-2 Z M-0.8,-4 L-0.8,-50 L0.8,-50 L0.8,-4 Z"/>
    </g>
    <symbol id="simbolo" viewBox="-10 -14 120 80">
        <use href="#pena" transform="translate(20.0,54.0) rotate(-48)"/>
        <use href="#pena" transform="translate(30.0,51.8) rotate(-32)"/>
        <use href="#pena" transform="translate(40.0,50.4) rotate(-16)"/>
        <use href="#pena" transform="translate(50.0,50.0) rotate(0)"/>
        <use href="#pena" transform="translate(60.0,50.4) rotate(16)"/>
        <use href="#pena" transform="translate(70.0,51.8) rotate(32)"/>
        <use href="#pena" transform="translate(80.0,54.0) rotate(48)"/>
      <path fill-rule="evenodd" d="M14,50 Q50,44 86,50 L86,63 Q50,57 14,63 Z M28,56 L32,53 L36,56 L32,59 Z M46,54.5 L50,51.5 L54,54.5 L50,57.5 Z M64,56 L68,53 L72,56 L68,59 Z"/>
    </symbol>
    <!-- Grafismo: dentes de serra -->
    <pattern id="serra" width="16" height="22" patternUnits="userSpaceOnUse">
      <rect width="16" height="22" fill="#22B35E"/>
      <path d="M0,22 L8,9 L16,22 Z" fill="#151515"/>
    </pattern>
    <clipPath id="dome">
      <path d="M190,432 C180,290 240,210 310,210 C380,210 420,260 430,320 C470,340 510,380 525,450 C505,452 495,450 485,445 C470,400 445,380 412,372 L410,432 Z"/>
    </clipPath>
    <clipPath id="cabeca">
      <ellipse cx="900" cy="290" rx="115" ry="145"/>
    </clipPath>
    <clipPath id="gola">
      <path d="M790,560 L1010,560 L985,420 L815,420 Z"/>
    </clipPath>
  </defs>
  <use href="#simbolo" x="20" y="20" width="360" height="260" fill="#22B35E"/>
</svg>
